include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # scan buffers use typed lists heavily; keep these as warnings not errors
    prefer_const_constructors: warning

linter:
  rules:
    - prefer_final_locals
    - avoid_print
    - require_trailing_commas
